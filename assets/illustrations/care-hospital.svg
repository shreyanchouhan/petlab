<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-label="A veterinary hospital ward: a vet monitors a dog on an exam table, with an IV stand, a wall vitals screen and the VETCARE analyser on a trolley.">
  <defs>
