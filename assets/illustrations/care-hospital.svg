    <linearGradient id="hf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCCEF5"/><stop offset="1" stop-color="#D0BFF0"/>
    </linearGradient>
  </defs>
  <!-- wall and floor -->
  <rect width="1000" height="800" fill="url(#hw)"/>
  <rect y="600" width="1000" height="200" fill="url(#hf)"/>
  <rect y="596" width="1000" height="8" fill="#C7B4EC"/>
  <!-- window -->
